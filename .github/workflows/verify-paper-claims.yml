name: Verify paper claims

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Recompute released results
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify paper claims
        run: python3 scripts/verify_paper_claims.py

      - name: Reproduce revision analyses from public inputs
        run: python3 -S scripts/derive_masking_analysis.py --output-dir "${RUNNER_TEMP}/masking-analysis" --check

      - name: Test portable analysis and failure handling
        run: python3 -S scripts/test_masking_analysis.py
